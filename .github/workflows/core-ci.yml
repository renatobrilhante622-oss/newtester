name: Core C# CI
on:
  push:
    branches: [main, feat/android-offline-foundation]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/MuReborn.Core/MuReborn.Core.csproj -c Release
